<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulplaner</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1e2b;--mut:#6b7185;--ac:#4f6bff;--bd:#e3e6f0;--ok:#22a06b;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9aa1b9;--bd:#2c3040}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9aa1b9;--bd:#2c3040}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:.75rem;padding:1rem;max-width:900px;margin:auto}
header h1{font-size:1.3rem;margin:0}
#dirty{max-width:900px;margin:0 auto .5rem;padding:.6rem 1rem;background:var(--ac);color:#fff;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:.5rem}#dirty button{background:#fff;color:#000;border:0;border-radius:8px;padding:.4rem .8rem;font:inherit;cursor:pointer}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw.on{border-color:var(--tx)}
nav{display:flex;gap:.4rem;padding:0 1rem;max-width:900px;margin:auto;overflow-x:auto}
nav button{border:0;background:var(--card);color:var(--mut);padding:.55rem 1rem;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap;border:1px solid var(--bd)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 10px #0000000d}
h2{font-size:1.1rem;margin:0 0 .75rem}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:.5rem .6rem}
button.b{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}
button.g{background:transparent;color:var(--mut);border-color:var(--bd)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.row input{flex:1;min-width:8rem}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
th{color:var(--mut);font-weight:600;font-size:.85em}
td input{width:100%;text-align:center;padding:.5rem .2rem;font-size:.9em}
td.n{color:var(--mut);text-align:center;width:3.4rem;line-height:1.2}td.n small{display:block;font-size:.7em}td.off{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);text-align:center;border-radius:10px;font-size:.85em}td input[type=checkbox]{width:1.7rem;height:1.7rem;accent-color:var(--ac);cursor:pointer}tr.gone{opacity:.45}
.item{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item .t{flex:1}.item small{color:var(--mut);display:block}
.done .t{text-decoration:line-through;opacity:.5}
.pill{padding:.2rem .6rem;border-radius:999px;background:var(--bg);font-size:.85em;white-space:nowrap}
.pill.soon{background:var(--bad);color:#fff}
.msg{color:var(--mut);font-size:.9em;margin:.4rem 0}
label.s{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;gap:1rem}
header{display:block;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#8b5cf6));color:#fff;border-radius:0 0 26px 26px;max-width:none;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1rem 1.6rem;margin:0 0 1rem;box-shadow:0 10px 28px color-mix(in srgb,var(--ac) 35%,transparent)}
header h1,#sub{max-width:900px;margin:0 auto}
header h1{font-size:1.8rem;letter-spacing:-.02em}
#sub{opacity:.85;font-size:.95rem;margin-top:.15rem}
.card{transition:box-shadow .2s;animation:in .3s ease}
.card:hover{box-shadow:0 8px 24px #0000001a}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{display:flex;align-items:center;gap:.5rem}
h2:before{content:"";width:.3rem;height:1.1em;border-radius:4px;background:var(--ac)}
nav button.on{box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 45%,transparent)}
th.today{color:#fff;background:var(--ac);border-radius:8px}
td input:focus,input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
button[data-rm],button[data-rs],button[data-x],button[data-y]{padding:.15rem .5rem;font-size:.85em;line-height:1.3;border-radius:8px}
td.c{border:1px solid var(--bd);border-radius:10px;padding:2px}
td.c select{width:100%;border:0;background:transparent;color:inherit;font-weight:600;padding:.35rem .1rem;text-align-last:center}
td.c input{border:0;background:transparent;font-size:.75em;padding:.1rem;color:var(--mut)}
td.off{border:1px solid transparent}
button[data-sd]{padding:.05rem .4rem;font-size:.8em}
</style>
</head>
<body>
<header><h1 id="sname">Schulplaner</h1><div id="sub"></div></header>
<div id="dirty" hidden></div>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const API_URL='https://workers.dev';
let auth=null;try{auth=JSON.parse(localStorage.getItem('planer_auth')||'null')}catch(e){}
const API=()=>String((auth&&auth.api)||localStorage.getItem('planer_api')||API_URL).replace(/\/$/,'');
async function api(path,opt={}){const r=await fetch(API()+path,{...opt,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth.token}:{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Fehler '+r.status),{status:r.status});return j}
async function pull(){if(!auth)return'none';const j=await api('/data');if(j.data&&(j.ts||0)>(S.ts||0)){S=Object.assign(DEF(),j.data);S.ts=j.ts;try{localStorage.setItem('planer_v2',JSON.stringify(S))}catch(e){}dirty=false;applySet();banner();draw();return'pulled'}return'same'}
const push=()=>api('/data',{method:'PUT',body:JSON.stringify({data:S,ts:S.ts})});
function logout(){auth=null;try{localStorage.removeItem('planer_auth')}catch(e){}draw()}
const DAYS=['Mo','Di','Mi','Do','Fr'],PER=10,COL=['#4f6bff','#22a06b','#f08a24','#e0407a','#8b5cf6','#0ea5e9','#e5484d','#14b8a6','#eab308','#64748b'];
const DEF=()=>({name:'Schulplaner',subjects:[],tt:{},off:{},times:{},tasks:[],exams:[],set:{theme:'auto',size:'1',ac:'#4f6bff',start:'tt',cm:'status',cf:'#e5484d',cb:'#22a06b'}});
let S=DEF(),tab='tt',dirty=false;
try{const r=localStorage.getItem('planer_v2');if(r){const o=JSON.parse(r);S=Object.assign(DEF(),o);S.set=Object.assign(DEF().set,o.set)}}catch(e){}
tab=S.set.start||'tt';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function mark(){dirty=true;banner()}
function banner(){$('dirty').innerHTML=dirty?'<span>Ungespeicherte Änderungen. Bitte speichern!</span><button id="sv2">Speichern</button>':'';$('dirty').hidden=!dirty;if($('sv2'))$('sv2').onclick=doSave}
async function doSave(){S.ts=Date.now();const say=t=>{const m=$('svm');if(m)m.textContent=t},tm=()=>new Date().toLocaleTimeString('de-DE');
try{localStorage.setItem('planer_v2',JSON.stringify(S));dirty=false;banner();say('Gespeichert um '+tm()+' Uhr.')}catch(e){say('Speichern im Browser nicht möglich. Nutze die Sicherungsdatei.')}
if(auth){try{await push();say('Gespeichert und mit deinem Konto synchronisiert ('+tm()+' Uhr).')}catch(e){say('Lokal gespeichert, aber die Synchronisierung ist fehlgeschlagen: '+e.message);if(e.status===401)logout()}}}
function applySet(){const r=document.documentElement,t=S.set.theme;t==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t);r.style.fontSize=({'0.875':'14px','1':'16px','1.25':'20px'})[S.set.size]||'16px';r.style.setProperty('--ac',S.set.ac);$('sname').textContent=S.name||'Schulplaner';document.title=S.name||'Schulplaner';$('sub').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
const DEFSUB=['Deutsch','Mathe','Englisch','Biologie','Chemie','Physik','Geschichte','Erdkunde','Politik','Sport','Kunst','Musik','Religion','Ethik','Informatik','Französisch','Spanisch','Latein'];
const subOf=v=>String(v||'').split(' · ')[0].trim(),roomOf=v=>String(v||'').split(' · ').slice(1).join(' · ');
const subs=()=>[...new Set([...DEFSUB,...S.subjects,...Object.values(S.tt).map(subOf).filter(Boolean)])];
const dl=()=>`<datalist id="subj">${subs().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
function nav(){const t=[['tt','📅 Stundenplan'],['hw','📚 Lernzeit'],['ex','📝 Klausuren'],['st','⚙️ Einstellungen']];
$('nav').innerHTML=t.map(([k,v])=>`<button class="${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()})}
function draw(){nav();$('main').innerHTML=({tt:vTT,hw:vHW,ex:vEX,st:vST})[tab]();bind();banner()}
function vTT(){let h=`<div class="card"><h2>Kalenderdatei importieren</h2><div class="row"><input type="file" id="imp" accept=".ics"><button class="b" id="impb">Importieren</button></div><div class="msg" id="impm">Optional, z. B. Export aus Untis. Sonst wähle die Fächer in der Tabelle selbst aus und speichere.</div></div><div class="card scroll"><h2>Mein Stundenplan</h2><table><tr><th></th>${DAYS.map((d,i)=>`<th class="${(new Date().getDay()+6)%7===i?'today':''}">${d}</th>`).join('')}</tr>`;
for(let p=1;p<=PER;p++){if(DAYS.every((d,i)=>S.off[i+'_'+p]))continue;h+=`<tr><td class="n"><b>${p}</b>${S.times[p]?`<small>${esc(S.times[p])}</small>`:''}</td>`+DAYS.map((d,i)=>{const k=i+'_'+p,v=S.tt[k];return S.off[k]?`<td class="off" style="${cs('',1)}">frei</td>`:`<td class="c" style="${cs(v)}"><select data-s="${k}"><option value="">–</option>${subs().map(x=>`<option ${x===subOf(v)?'selected':''}>${esc(x)}</option>`).join('')}</select><input data-r="${k}" placeholder="Raum" value="${esc(roomOf(v))}"></td>`}).join('')+'</tr>'}
return h+'</table></div>'}
function vHW(){const L=[...S.tasks].sort((a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9'));
return `<div class="card"><h2>Neue Lernzeit-Aufgabe</h2><div class="row"><input id="ht" placeholder="Aufgabe"><input id="hs" list="subj" placeholder="Fach wählen" style="max-width:10rem">${dl()}<input id="hd" type="date" style="flex:0"><button class="b" id="ha">Hinzufügen</button></div></div><div class="card"><h2>Aufgaben</h2>${L.map(t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-d="${t.id}" ${t.done?'checked':''}><div class="t">${esc(t.text)}<small>${esc(t.subj)} ${t.due?'· fällig '+new Date(t.due).toLocaleDateString('de-DE'):''}</small></div><button class="b g" data-x="${t.id}">✕</button></div>`).join('')||'<div class="msg">Noch nichts eingetragen.</div>'}</div>`}
function vEX(){const L=[...S.exams].sort((a,b)=>a.date.localeCompare(b.date)),today=new Date(new Date().toDateString());
return `<div class="card"><h2>Neue Klausur</h2><div class="row"><input id="es" list="subj" placeholder="Fach wählen">${dl()}<input id="en" placeholder="Themen (optional)"><input id="ed" type="date" style="flex:0"><button class="b" id="ea">Hinzufügen</button></div></div><div class="card"><h2>Klausuren</h2>${L.map(e=>{const d=Math.round((new Date(e.date)-today)/864e5);return `<div class="item"><div class="t">${esc(e.subj)}<small>${new Date(e.date).toLocaleDateString('de-DE')} ${esc(e.note)}</small></div><span class="pill ${d>=0&&d<=7?'soon':''}">${d<0?'vorbei':d===0?'heute':'in '+d+' Tagen'}</span><button class="b g" data-y="${e.id}">✕</button></div>`}).join('')||'<div class="msg">Keine Klausuren eingetragen.</div>'}</div>`}
function vST(){const o=(v,a,l)=>`<option value="${v}" ${a===v?'selected':''}>${l}</option>`;
return `<div class="card"><h2>Speichern</h2><div class="msg"><b>Wichtig:</b> Das Speichern ist notwendig. Nur gespeicherte Änderungen bleiben nach dem Schließen erhalten.</div><div class="row"><button class="b" id="sv">Jetzt speichern</button></div><div class="msg" id="svm"></div></div>
<div class="card"><h2>Einstellungen</h2><label class="s">Name der App<input id="nm" value="${esc(S.name)}" placeholder="z. B. Lernzeitplaner"></label><label class="s">Darstellung<select id="th">${o('auto',S.set.theme,'Automatisch')}${o('light',S.set.theme,'Hell')}${o('dark',S.set.theme,'Dunkel')}</select></label><label class="s">Schriftgröße<select id="sz">${o('0.875',S.set.size,'Klein')}${o('1',S.set.size,'Normal')}${o('1.25',S.set.size,'Groß')}</select></label><label class="s">Startseite<select id="stt">${o('tt',S.set.start,'Stundenplan')}${o('hw',S.set.start,'Lernzeit')}${o('ex',S.set.start,'Klausuren')}</select></label>
<label class="s">Stunden einfärben<select id="cm">${o('status',S.set.cm,'Rot = frei, Grün = belegt')}${o('subject',S.set.cm,'Nach Fach')}${o('off',S.set.cm,'Aus')}</select></label><label class="s">Farbe für „frei"<input type="color" id="cf" value="${S.set.cf}" style="width:3rem;padding:0"></label><label class="s">Farbe für „belegt"<input type="color" id="cb" value="${S.set.cb}" style="width:3rem;padding:0"></label>
<div class="s" style="display:block">Design-Farbe<div class="row" style="margin-top:.5rem">${COL.map(c=>`<button class="sw ${S.set.ac===c?'on':''}" data-k="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="kc" value="${S.set.ac}" style="padding:0;width:2.6rem;height:2.2rem;flex:0"></div></div></div>
${vAcc()}${vSub()}${vGrid()}<div class="card"><h2>Sicherungsdatei</h2><div class="row"><button class="b" id="bx">Datei speichern</button><input type="file" id="bi" accept=".json"><button class="b g" id="bib">Datei laden</button></div><div class="msg" id="sm">Lege die Datei z. B. in iCloud Drive ab.</div></div>`}
const tint=v=>{const sj=String(v||'').split(' · ')[0].trim();if(!sj)return'';let h=0;for(const c of sj.toLowerCase())h=(h*31+c.charCodeAt(0))%360;return `background:color-mix(in srgb,hsl(${h} 70% 55%) 24%,var(--card));border-color:hsl(${h} 60% 55% / .5);font-weight:600`};
const cs=(v,off)=>{const m=S.set.cm;if(off)return m==='status'?`background:color-mix(in srgb,${S.set.cf} 22%,transparent);color:${S.set.cf}`:'background:var(--bg);color:var(--mut)';if(m==='status'&&subOf(v))return `background:color-mix(in srgb,${S.set.cb} 22%,var(--card));border-color:color-mix(in srgb,${S.set.cb} 55%,transparent)`;return m==='subject'?tint(v):''};
function vAcc(){if(auth)return `<div class="card"><h2>Konto</h2><div class="msg">Angemeldet als <b>${esc(auth.email)}</b>. Beim Speichern werden deine Daten automatisch mit allen Geräten synchronisiert.</div><div class="row"><button class="b" id="sy">Jetzt synchronisieren</button><button class="b g" id="lo">Abmelden</button></div><div class="msg" id="am"></div></div>`;
return `<div class="card"><h2>Konto und Synchronisierung</h2><div class="msg">Melde dich an, damit deine Daten auf allen Geräten gleich sind. Ohne Konto bleiben sie nur in diesem Browser.</div>${API_URL?'':`<div class="row"><input id="au" placeholder="Server-Adresse (https://….workers.dev)" value="${esc(localStorage.getItem('planer_api')||'')}"></div>`}<div class="row"><input id="ae" type="email" placeholder="E-Mail" autocomplete="username"><input id="ap" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password"></div><div class="row"><button class="b" id="li">Anmelden</button><button class="b g" id="re">Registrieren</button></div><div class="msg" id="am"></div></div>`}
async function authGo(mode){const m=$('am'),u=$('au');if(u){const v=u.value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(v)){m.textContent='Bitte die Worker-Adresse mit https:// eintragen.';return}localStorage.setItem('planer_api',v)}
m.textContent='Bitte warten …';try{const r=await api('/'+mode,{method:'POST',body:JSON.stringify({email:$('ae').value.trim().toLowerCase(),password:$('ap').value})});auth={api:API(),email:$('ae').value.trim().toLowerCase(),token:r.token};localStorage.setItem('planer_auth',JSON.stringify(auth));if(await pull()==='same')await push().catch(()=>{});draw()}catch(e){m.textContent=e.status?e.message:'Server nicht erreichbar. Prüfe die Adresse.'}}
function vSub(){return `<div class="card"><h2>Fächer</h2><div class="msg">Vorschläge wie Deutsch, Mathe, Englisch sind schon dabei. Eigene Fächer fügst du hier hinzu:</div><div class="row"><input id="sn" placeholder="Eigenes Fach"><button class="b" id="sa">Hinzufügen</button></div><div class="row">${S.subjects.map((x,i)=>`<span class="pill">${esc(x)} <button class="b g" data-sd="${i}">✕</button></span>`).join('')||'<span class="msg">Noch keine eigenen Fächer.</span>'}</div></div>`}
const lastOn=i=>{let n=0;for(let p=1;p<=PER;p++)if(!S.off[i+'_'+p])n=p;return n};
function vGrid(){let h=`<div class="card scroll"><h2>Stundenraster</h2><div class="msg">Trage Uhrzeiten ein und lege pro Tag fest, welche Stunden stattfinden. Abgewählte Stunden erscheinen im Stundenplan rot als „frei".</div><table><tr><th>Std.</th><th>Uhrzeit</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}<th></th></tr><tr><td></td><td class="msg">Stunden pro Tag</td>${DAYS.map((d,i)=>`<td><select data-n="${i}" style="width:100%">${Array.from({length:PER+1},(_,n)=>`<option value="${n}" ${lastOn(i)===n?'selected':''}>${n}</option>`).join('')}</select></td>`).join('')}<td></td></tr>`;
for(let p=1;p<=PER;p++){const gone=DAYS.every((d,i)=>S.off[i+'_'+p]);h+=`<tr class="${gone?'gone':''}"><td class="n"><b>${p}</b></td><td><input data-tm="${p}" value="${esc(S.times[p])}" placeholder="08:00–08:45" style="min-width:7.5rem"></td>`+DAYS.map((d,i)=>`<td style="text-align:center"><input type="checkbox" data-o="${i}_${p}" ${S.off[i+'_'+p]?'':'checked'}></td>`).join('')+`<td>${gone?`<button class="b" data-rs="${p}" title="Stunde wiederherstellen">↺</button>`:`<button class="b g" data-rm="${p}" title="Stunde entfernen">✕</button>`}</td></tr>`}
return h+'</table></div>'}
function bind(){
if($('li'))$('li').onclick=()=>authGo('login');
if($('re'))$('re').onclick=()=>authGo('register');
if($('lo'))$('lo').onclick=logout;
if($('sy'))$('sy').onclick=async()=>{const m=$('am');m.textContent='…';try{if(await pull()==='same')await push();$('am').textContent='Synchronisiert.'}catch(e){m.textContent='Fehler: '+e.message}};
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{DAYS.forEach((d,i)=>S.off[i+'_'+b.dataset.rm]=1);mark();draw()});
document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{DAYS.forEach((d,i)=>delete S.off[i+'_'+b.dataset.rs]);mark();draw()});
document.querySelectorAll('[data-tm]').forEach(i=>i.oninput=()=>{S.times[i.dataset.tm]=i.value;mark()});
document.querySelectorAll('[data-o]').forEach(c=>c.onchange=()=>{c.checked?delete S.off[c.dataset.o]:S.off[c.dataset.o]=1;mark();draw()});
document.querySelectorAll('[data-n]').forEach(x=>x.onchange=()=>{const d=x.dataset.n,n=+x.value;for(let p=1;p<=PER;p++)p>n?S.off[d+'_'+p]=1:delete S.off[d+'_'+p];mark();draw()});
const upd=k=>{const a=document.querySelector(`[data-s="${k}"]`),r=document.querySelector(`[data-r="${k}"]`);S.tt[k]=a.value?a.value+(r.value.trim()?' · '+r.value.trim():''):'';a.closest('td').style.cssText=cs(S.tt[k]);mark()};
document.querySelectorAll('[data-s]').forEach(x=>x.onchange=()=>upd(x.dataset.s));
document.querySelectorAll('[data-r]').forEach(x=>x.oninput=()=>upd(x.dataset.r));
if($('sa'))$('sa').onclick=()=>{const v=$('sn').value.trim();if(!v)return;if(!S.subjects.includes(v))S.subjects.push(v);mark();draw()};
document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{S.subjects.splice(+b.dataset.sd,1);mark();draw()});
if($('cm'))$('cm').onchange=e=>{S.set.cm=e.target.value;mark()};
if($('cf'))$('cf').oninput=e=>{S.set.cf=e.target.value;mark()};
if($('cb'))$('cb').oninput=e=>{S.set.cb=e.target.value;mark()};
if($('impb'))$('impb').onclick=doImport;
if($('ha'))$('ha').onclick=()=>{const t=$('ht').value.trim();if(!t)return;S.tasks.push({id:uid(),text:t,subj:$('hs').value,due:$('hd').value,done:false});mark();draw()};
document.querySelectorAll('[data-d]').forEach(c=>c.onchange=()=>{S.tasks.find(t=>t.id===c.dataset.d).done=c.checked;mark();draw()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.x);mark();draw()});
if($('ea'))$('ea').onclick=()=>{if(!$('es').value.trim()||!$('ed').value)return;S.exams.push({id:uid(),subj:$('es').value,date:$('ed').value,note:$('en').value});mark();draw()};
document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{S.exams=S.exams.filter(t=>t.id!==b.dataset.y);mark();draw()});
if($('sv'))$('sv').onclick=doSave;
if($('nm'))$('nm').oninput=e=>{S.name=e.target.value;mark();applySet()};
if($('th'))$('th').onchange=e=>{S.set.theme=e.target.value;mark();applySet()};
if($('sz'))$('sz').onchange=e=>{S.set.size=e.target.value;mark();applySet()};
if($('stt'))$('stt').onchange=e=>{S.set.start=e.target.value;mark()};
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.set.ac=b.dataset.k;mark();applySet();draw()});
if($('kc'))$('kc').oninput=e=>{S.set.ac=e.target.value;mark();applySet()};
if($('bx'))$('bx').onclick=async()=>{const txt=JSON.stringify(S);try{const d=await claude.use('downloads');await d.save({filename:'schulplaner-sicherung.json',data:txt})}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='schulplaner-sicherung.json';a.click()}};
if($('bib'))$('bib').onclick=async()=>{const f=$('bi').files[0];if(!f)return;try{S=Object.assign(DEF(),JSON.parse(await f.text()));mark();applySet();draw()}catch(e){$('sm').textContent='Datei nicht lesbar.'}}}
function parseIcs(t){const rows=[];t.split('BEGIN:VEVENT').slice(1).forEach(e=>{const g=k=>{const m=e.match(new RegExp('\\n'+k+'[^:\\n]*:([^\\r\\n]*)'));return m?m[1].trim():''},m=g('DTSTART').match(/(\d{4})(\d\d)(\d\d)T?(\d\d)?(\d\d)?/);if(!m)return;const wd=(new Date(+m[1],m[2]-1,+m[3]).getDay()+6)%7;if(wd>4)return;rows.push({d:wd,t:(+m[4]||0)*60+(+m[5]||0),s:g('SUMMARY'),r:g('LOCATION')})});
const ts=[...new Set(rows.map(r=>r.t))].sort((a,b)=>a-b);return rows.map(r=>({d:r.d,p:ts.indexOf(r.t)+1,s:r.s,r:r.r}))}
function fill(cells){let n=0;cells.forEach(c=>{const d=+c.d,p=+c.p;if(d>=0&&d<5&&p>=1&&p<=PER&&c.s){S.tt[d+'_'+p]=c.s+(c.r?' · '+c.r:'');delete S.off[d+'_'+p];n++}});return n}
async function doImport(){const m=$('impm'),f=$('imp').files[0];if(!f){m.textContent='Bitte zuerst eine .ics-Datei wählen.';return}try{const n=fill(parseIcs(await f.text()));if(!n){m.textContent='Keine Termine gefunden.';return}mark();draw();$('impm').textContent=n+' Stunden übernommen. Bitte prüfen und speichern.'}catch(e){m.textContent='Datei nicht lesbar.'}}
applySet();draw();
if(auth)pull().catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth&&!dirty)pull().catch(()=>{})});
</script>
</body>
</html>
